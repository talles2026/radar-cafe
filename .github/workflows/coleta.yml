name: Coleta e publicação

on:
  schedule:
    # de hora em hora, das 6h10 às 19h10 de Brasília (UTC-3), de segunda a sexta:
    # pega a abertura de NY e do dólar antes das cooperativas fecharem o preço da manhã.
    # O GitHub pode atrasar execuções agendadas em alguns minutos.
    - cron: "10 9-22 * * 1-5"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mudou: ${{ steps.gravar.outputs.mudou }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar dados de mercado
        run: |
          pip install --quiet xlrd openpyxl
          python scripts/collect.py
      - name: Calcular indicadores do dia
        run: python scripts/indicadores.py
      - name: Enviar resumo e alertas no Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: python scripts/telegram.py
      - name: Gravar no repositório
        id: gravar
        run: |
          git config user.name "radar-cafe-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nada mudou."
            echo "mudou=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "mudou=true" >> "$GITHUB_OUTPUT"
          git commit -m "Coleta automática $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 5
          done
          exit 1

  publicar:
    needs: coletar
    # só republica quando algo mudou (ou quando o código foi alterado)
    if: always() && needs.coletar.result == 'success' && (needs.coletar.outputs.mudou == 'true' || github.event_name != 'schedule')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4

  avisar:
    needs: publicar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enviar notificações no celular (Supabase)
        run: |
          sleep 20
          ANON=$(curl -s https://talles2026.github.io/radar-cafe/data/config.json | python3 -c "import sys,json;print(json.load(sys.stdin)['supabaseAnon'])")
          curl -s -X POST "https://gqfuuqvnlkcdztufygfu.supabase.co/functions/v1/radar-push" \
            -H "Authorization: Bearer $ANON" -H "Content-Type: application/json" -d '{}' --max-time 120

